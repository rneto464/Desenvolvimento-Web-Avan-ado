<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de Notícias - UPAON</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-container">
    <header class="glass-header">
      <div class="logo">
        <h1>UPAON<span>News</span></h1>
      </div>
      <nav class="region-nav" id="region-nav">
        <!-- Links gerados dinamicamente via JS -->
      </nav>
    </header>

    <main class="main-content">
      <section class="hero-section">
        <h2 id="current-region-title">Últimas Notícias - Ilha de São Luís</h2>
        <p class="subtitle">Fique atualizado com os acontecimentos da sua região.</p>
      </section>

      <div class="news-grid" id="news-grid">
        <!-- Notícias geradas dinamicamente via JS -->
        <div class="loader">Carregando notícias...</div>
      </div>
    </main>

    <footer>
      <p>&copy; 2026 Portal UPAON. Todos os direitos reservados.</p>
    </footer>
  </div>

  <script src="/js/app.js"></script>
</body>
</html>
