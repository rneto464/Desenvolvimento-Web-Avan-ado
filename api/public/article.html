<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lendo Notícia - UPAON</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app-container">
    <header class="glass-header">
      <div class="logo">
        <h1>UPAON<span>News</span></h1>
      </div>
      <nav class="region-nav">
        <button class="nav-btn active" onclick="window.location.href='/'">➔ Voltar para Home</button>
      </nav>
    </header>

    <main class="main-content">
      <div id="article-loader" class="loader">Carregando notícia...</div>
      
      <article id="article-content" class="news-article-page" style="display: none;">
        <div class="article-header">
          <span class="category-badge" id="article-category">Categoria</span>
          <span class="time-ago" id="article-time">Tempo</span>
        </div>
        <h2 id="article-title">Título da Notícia</h2>
        <div class="article-meta">
          <span class="source" id="article-source">Fonte</span>
        </div>
        <div class="article-body" id="article-body">
          Conteúdo da notícia...
        </div>
      </article>
    </main>

    <footer>
      <p>&copy; 2026 Portal UPAON. Todos os direitos reservados.</p>
    </footer>
  </div>

  <script src="/js/article.js"></script>
</body>
</html>
